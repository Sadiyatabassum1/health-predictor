<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Health Tracker</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1f2933; --muted:#6b7785; --line:#e1e6ec;
          --accent:#1d6fb8; --danger:#c0392b; --ok:#1e8449; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:1.25rem; font-weight:600; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:20px; margin-bottom:24px; }
  h2 { margin:0 0 14px; font-size:1.05rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.95rem; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button, .btn { display:inline-block; padding:8px 14px; border:0; border-radius:6px; cursor:pointer;
                 font-size:.9rem; background:var(--accent); color:#fff; text-decoration:none; }
  .btn-secondary { background:#52606d; }
  .btn-danger { background:var(--danger); }
  .btn-small { padding:5px 10px; font-size:.8rem; }
  .actions { margin-top:16px; display:flex; gap:8px; }
  .flash { padding:10px 14px; border-radius:6px; margin-bottom:10px; font-size:.9rem; }
  .flash.error { background:#fdecea; color:var(--danger); border:1px solid #f5c6c1; }
  .flash.success { background:#e8f6ee; color:var(--ok); border:1px solid #bfe3cd; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
  .remarks { max-width:320px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .row-actions form { margin:0; }
  .empty { color:var(--muted); padding:12px 0; }
  .table-wrap { overflow-x:auto; }
  .hint { font-size:.8rem; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<header><h1>Patient Health Tracker</h1></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
